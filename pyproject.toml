[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "price-to-profit-backend"
version = "0.1.0"
description = "Backend API for Price to Profit, a quote, pricing and invoice app for hair extension stylists."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0.30,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pytest>=8.3,<9",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.documents" = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
# `Decimal as D` keeps the expected-value tables in tests readable.
"tests/*" = ["N817"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
