services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-to-profit-api
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ptp_data:/app/data
      - ptp_media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ptp_data:
  ptp_media:
