name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check app tests migrations

      - name: Check Code Formatting
        run: |
          ruff format --check app tests migrations

      - name: Run Pytest
        run: |
          pytest -v

  build-docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: price-to-profit-api:latest

  deploy:
    name: Deploy to EC2
    needs: [test, build-docker]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: |
            PTP_APP_NAME="Price to Profit API"
            PTP_APP_VERSION="0.1.0"
            PTP_ENVIRONMENT="local"
            PTP_DATABASE_URL="sqlite:////app/data/price_to_profit.db"
            PTP_MEDIA_DIR="/app/media"
            PTP_MAX_LOGO_BYTES=2000000
            PTP_CORS_ORIGINS=["*"]
            PTP_SESSION_DAYS=30
            PTP_OTP_MINUTES=10
            PTP_S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME || vars.S3_BUCKET_NAME }}"
            PTP_S3_REGION="${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}"
            PTP_AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            PTP_AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
        with:
          host: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER || vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_CONTENT
          script: |
            sudo mkdir -p /var/www/price-to-profit
            sudo chown -R $USER:$USER /var/www/price-to-profit
            cd /var/www/price-to-profit

            # Ensure Docker is installed on EC2
            if ! command -v docker &> /dev/null; then
              echo "==> Docker not found on EC2. Installing Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER || true
              sudo systemctl enable --now docker
            fi

            # Initialize repo if needed, otherwise pull latest
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            # Auto-write production .env from GitHub secrets (no manual editing needed!)
            echo "$ENV_CONTENT" > .env

            # Run Docker containers
            echo "==> Starting containers with Docker Compose..."
            sudo docker compose down || true
            sudo docker compose up -d --build

            # Status check
            sleep 6
            sudo docker compose ps
            echo "==> Checking API health probe..."
            curl -I http://localhost:8000/health/live || true
